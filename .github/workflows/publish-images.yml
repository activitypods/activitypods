name: Publish Pod provider Docker images

# Builds the Pod provider images (backend, frontend, arena) for linux/amd64 and linux/arm64
# and pushes them to Docker Hub (activitypods/<component>) and to the GitHub Container
# Registry (ghcr.io/<owner>/<component>), replacing the local `make publish-*` targets in
# pod-provider/Makefile (still usable as a fallback).
#
#   push of a `v*` git tag -> :vX.Y.Z  (plus :latest when asked for in a manual run)
#   push on `next`         -> :next    (moving tag for the development Pod providers)
#
# Docker Hub needs the DOCKERHUB_USERNAME / DOCKERHUB_TOKEN repository secrets; until they
# are set only ghcr.io is pushed to (GITHUB_TOKEN is enough there).

on:
  push:
    branches: [next]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      latest:
        description: Also move the :latest tag to this build
        type: boolean
        default: false

concurrency:
  group: publish-images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      # Secrets can't be tested in `if:` directly, so surface their presence as an env var
      HAS_DOCKERHUB: ${{ secrets.DOCKERHUB_TOKEN != '' }}
    strategy:
      fail-fast: false
      matrix:
        component: [backend, frontend, arena]

    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so that `git describe` sees the tags
          fetch-depth: 0

      - name: Compute the version baked into the backend (shown in nodeinfo)
        id: version
        run: echo "version=$(git describe --tags --always --match 'v[0-9]*' | sed 's/^v//')" >> "$GITHUB_OUTPUT"

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: |
            name=docker.io/activitypods/${{ matrix.component }},enable=${{ env.HAS_DOCKERHUB }}
            name=ghcr.io/${{ github.repository_owner }}/${{ matrix.component }}
          tags: |
            type=raw,value=next,enable=${{ github.ref == 'refs/heads/next' }}
            type=semver,pattern={{raw}}
            type=raw,value=latest,enable=${{ github.event.inputs.latest == 'true' }}

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/login-action@v3
        if: env.HAS_DOCKERHUB == 'true'
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./pod-provider
          file: ./pod-provider/docker/${{ matrix.component }}.dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}
          # Only the backend image uses it
          build-args: |
            ACTIVITYPODS_VERSION=${{ steps.version.outputs.version }}
